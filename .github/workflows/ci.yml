name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Check, unit, build, e2e + a11y
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # `yarn check` alone is Yarn 1's built-in integrity check — `run` calls the script.
      - name: Type check (astro check)
        run: yarn run check

      - name: Unit tests
        run: yarn test:unit

      - name: Cache optimized images
        uses: actions/cache@v6
        with:
          path: node_modules/.astro
          key: astro-assets-${{ hashFiles('src/assets/**', 'astro.config.mjs', 'yarn.lock') }}
          restore-keys: astro-assets-

      # A dummy PostHog key so the e2e suite can check analytics (requests are mocked).
      - name: Build
        run: yarn build
        env:
          PUBLIC_POSTHOG_KEY: phc_e2e

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('yarn.lock') }}

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: yarn playwright install --with-deps chromium

      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: yarn playwright install-deps chromium

      - name: E2E + accessibility tests
        run: yarn test:e2e:dist

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

      - name: Upload accessibility report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: a11y-report
          path: test-results/a11y-report.json
          if-no-files-found: ignore
          retention-days: 30
