[build]
  command = "yarn build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Security headers for every page.
# The full Content-Security-Policy runs in report-only mode first: violations
# are logged by /api/csp-report (Netlify function log, lines start "[csp]").
# When the log stays clean — Google Tag Manager may add tags not listed here —
# rename "Content-Security-Policy-Report-Only" to "Content-Security-Policy".
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), usb=(), interest-cohort=()"
    Strict-Transport-Security = "max-age=31536000"
    Content-Security-Policy = "frame-ancestors 'self'; base-uri 'self'; object-src 'none'"
    Content-Security-Policy-Report-Only = "default-src 'self'; script-src 'self' https://www.googletagmanager.com https://connect.facebook.net https://static.hotjar.com https://script.hotjar.com https://www.google.com/recaptcha/ https://www.gstatic.com/recaptcha/; style-src 'self' 'unsafe-inline' https://assets.mlcdn.com; font-src 'self' data: https://assets.mlcdn.com; img-src 'self' data: https:; media-src 'self' https:; connect-src 'self' https://assets.mailerlite.com https://*.google-analytics.com https://*.analytics.google.com https://*.googletagmanager.com https://www.facebook.com https://connect.facebook.net https://*.hotjar.com https://*.hotjar.io wss://*.hotjar.com https://docs.google.com; frame-src https://player.vimeo.com https://www.youtube-nocookie.com https://calendar.google.com https://www.google.com https://vars.hotjar.com https://www.googletagmanager.com; form-action 'self' https://assets.mailerlite.com https://docs.google.com; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; report-uri /api/csp-report; report-to csp"
    Reporting-Endpoints = 'csp="/api/csp-report"'

# Hashed build assets (CSS/JS/optimized images/fonts) never change.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Netlify-CDN-Cache-Control = "public, max-age=31536000, immutable"
    CDN-Cache-Control = "public, max-age=31536000, immutable"

# Unhashed artwork: browsers revalidate, the CDN caches for a day.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Netlify-CDN-Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"
    CDN-Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

# /magic is the main sales page (heavy traffic from ads): CDN-cache it.
[[headers]]
  for = "/magic"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Netlify-CDN-Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"
    CDN-Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/magic/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Netlify-CDN-Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"
    CDN-Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/magic/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Netlify-CDN-Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"
    CDN-Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"
