[build]
  command = "yarn build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Security headers for every page.
# The full Content-Security-Policy runs in report-only mode first: violations
# are logged by /api/csp-report (Netlify function log, lines start "[csp]").
# When the log stays clean, rename "Content-Security-Policy-Report-Only" to
# "Content-Security-Policy".
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), usb=(), interest-cohort=()"
    Strict-Transport-Security = "max-age=31536000"
    Content-Security-Policy = "frame-ancestors 'self'; base-uri 'self'; object-src 'none'"
    Content-Security-Policy-Report-Only = "default-src 'self'; script-src 'self' https://connect.facebook.net https://www.google.com/recaptcha/ https://www.gstatic.com/recaptcha/ https://eu.posthog.com; style-src 'self' 'unsafe-inline' https://assets.mlcdn.com https://fonts.mailerlite.com; font-src 'self' data: https://assets.mlcdn.com https://fonts.mailerlite.com; img-src 'self' data: https:; media-src 'self' https:; connect-src 'self' https://assets.mailerlite.com https://www.facebook.com https://connect.facebook.net https://docs.google.com https://eu.posthog.com; frame-src https://player.vimeo.com https://www.youtube-nocookie.com https://calendar.google.com https://www.google.com; form-action 'self' https://assets.mailerlite.com https://docs.google.com; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; report-uri /api/csp-report; report-to csp"
    Reporting-Endpoints = 'csp="/api/csp-report"'

# PostHog (EU Cloud) through our own domain: requests stay first-party, so
# ad blockers don't drop them and the CSP needs no PostHog hosts for tracking.
# /relay is `analytics.posthog.apiHost` in src/config/site.ts.
[[redirects]]
  from = "/relay/static/*"
  to = "https://eu-assets.i.posthog.com/static/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/relay/array/*"
  to = "https://eu-assets.i.posthog.com/array/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/relay/*"
  to = "https://eu.i.posthog.com/:splat"
  status = 200
  force = true

# Hashed build assets (CSS/JS/optimized images/fonts) never change.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Netlify-CDN-Cache-Control = "public, max-age=31536000, immutable"
    CDN-Cache-Control = "public, max-age=31536000, immutable"

# Unhashed artwork: browsers revalidate, the CDN caches for a day.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Netlify-CDN-Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"
    CDN-Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

# /magic is the main sales page (heavy traffic from ads): CDN-cache it.
[[headers]]
  for = "/magic"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Netlify-CDN-Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"
    CDN-Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/magic/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Netlify-CDN-Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"
    CDN-Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/magic/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Netlify-CDN-Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"
    CDN-Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

# Lighthouse scores in the Netlify deploy summary — the same plugin the
# production (Gatsby) project uses. Runs after each Netlify-built deploy
# against the deploy permalink (mobile preset).
[[plugins]]
  package = "@netlify/plugin-lighthouse"

  [[plugins.inputs.audits]]
    path = "/"
  [[plugins.inputs.audits]]
    path = "/magic/"
  [[plugins.inputs.audits]]
    path = "/magic-kolektyw/"
  [[plugins.inputs.audits]]
    path = "/jesien/"
  [[plugins.inputs.audits]]
    path = "/wyzwanie/"
